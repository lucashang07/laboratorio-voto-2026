name: Coletor da apuração (TSE)

on:
  workflow_dispatch:
    inputs:
      eleicao:
        description: 'Código da eleição no TSE (6258 = 2º turno presidencial de 2026; 6257 = 1º turno, para teste)'
        default: '6258'
        required: true
      minutos:
        description: 'Tempo máximo de coleta, em minutos'
        default: '330'
        required: true
  schedule:
    # Horários de Brasília. Cada execução no GitHub dura no máximo 6h, então a noite é coberta em rodadas.
    # Disparos feitos enquanto uma rodada está rodando ficam na fila (concurrency abaixo) e assumem quando ela termina,
    # continuando o histórico salvo no branch dados. Se a apuração já tiver terminado, a rodada sai sozinha.
    # 1ª rodada, 25/10: 16h30 (reservas às 16h55 e 17h20, caso o GitHub atrase ou pule um disparo); vai até ~22h
    - cron: '30 19 25 10 *'
    - cron: '55 19 25 10 *'
    - cron: '20 20 25 10 *'
    # 2ª rodada: disparos às 21h40 e 21h55 de 25/10; começa quando a 1ª termina (~22h) e vai até ~3h30
    - cron: '40 0 26 10 *'
    - cron: '55 0 26 10 *'
    # 3ª rodada: disparos às 3h10 e 3h25 de 26/10; começa quando a 2ª termina e vai até a apuração fechar (no 1º turno, o AM fechou às 4h59)
    - cron: '10 6 26 10 *'
    - cron: '25 6 26 10 *'

concurrency:
  group: coletor-apuracao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o branch de dados
        run: |
          git config --global user.name "coletor-apuracao"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dados
          git worktree add -B dados ../dados origin/dados
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Coletar
        env:
          ELEICAO: ${{ github.event.inputs.eleicao || '6258' }}
          MINUTOS: ${{ github.event.inputs.minutos || '330' }}
          DADOS_DIR: ../dados
        run: node coletor/coletor.mjs
